spring.application.name=hr-evaluation-backend

spring.config.import=file:../.env[.properties]
spring.datasource.url=jdbc:mysql://127.0.0.1:3311/hr_evaluation
spring.datasource.username=hr_user
spring.datasource.password=${DB_PASSWORD}

server.address=127.0.0.1

#点数の小数を自動で整数に変換せず、入力不備として断る
spring.jackson.deserialization.accept-float-as-int=false

#実行記録をファイルにも保存する
logging.file.name=logs/hr-evaluation.log