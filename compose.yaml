name: hr-evaluation

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: hr_evaluation
      MYSQL_USER: hr_user
      MYSQL_PASSWORD: ${DB_PASSWORD:?パスワードの設定が必要です}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?管理用パスワードの設定が必要です}
    ports:
      - "127.0.0.1:3311:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
