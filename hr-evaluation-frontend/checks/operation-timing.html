<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>通常操作の時間測定</title>
  </head>
  <body style="display:block;margin:0;min-height:100vh">
    <aside style="padding:16px;background:#fff8dc;font-family:sans-serif">
      <strong>時間測定専用：本物のAPI・MySQLを使います。</strong>
      <p>社員選択・保存・相対評価の操作から、完了した画面の描画機会までを測ります。保存は現在の点数を変えずに行ってください。削除は測定対象外です。</p>
      <p>同じPC・12人・1人ずつの操作での測定です。全環境で3秒以内という保証ではありません。</p>
      <ol id="measurements" aria-label="測定結果"></ol>
    </aside>
    <div id="root"></div>
    <script type="module">
      import React, { StrictMode } from "react";
      import { createRoot } from "react-dom/client";
      import App from "/src/App.jsx";
      import "/src/index.css";

      const root = document.getElementById("root");
      const measurements = document.getElementById("measurements");
      const scoreIds = ["practicalSkillScore", "problemSolvingScore", "logicalThinkingScore", "communicationScore", "goalAchievementScore"];
      let pending;

      function begin(label, isComplete) {
        if (pending) return;
        const item = document.createElement("li");
        item.textContent = `${label}：測定中`;
        measurements.append(item);
        const measurement = { label, isComplete, item, started: performance.now(), scheduled: false };
        pending = measurement;
        measurement.timeout = setTimeout(() => {
          if (pending !== measurement) return;
          item.textContent = `${label}：30秒以内に成功画面を確認できませんでした`;
          pending = undefined;
        }, 30000);
      }

      // Reactの処理より前のイベント捕捉から測る。通信や確認画面は置き換えない。
      root.addEventListener("change", (event) => {
        if (event.target.id !== "employee" || !event.target.value) return;
        const selectedId = event.target.value;
        begin(`社員の評価読み込み（番号${selectedId}）`, () =>
          document.getElementById("employee")?.value === selectedId &&
          scoreIds.every((id) => {
            const select = document.getElementById(id);
            return select && !select.disabled && select.value !== "";
          }) && !root.querySelector('[role="alert"]'),
        );
      }, true);

      root.addEventListener("click", (event) => {
        const button = event.target.closest("button");
        if (!button || button.disabled) return;
        if (button.classList.contains("save-button")) {
          begin("評価の保存", () =>
            !root.querySelector(".save-button")?.disabled &&
            [...root.querySelectorAll('[role="status"]')].some((element) =>
              ["保存しました", "更新しました", "登録しました"].includes(element.textContent.trim()),
            ),
          );
        }
        if (button.classList.contains("calculate-button")) {
          begin("相対評価の12人分の表示", () =>
            root.querySelector("h1")?.textContent === "評価一覧・結果画面" &&
            root.querySelectorAll("tbody tr").length === 12,
          );
        }
      }, true);

      // DOM更新後の2回の描画機会を待つ。ディスプレイへの物理的な表示時刻ではない。
      new MutationObserver(() => {
        const measurement = pending;
        if (!measurement || measurement.scheduled || !measurement.isComplete()) return;
        measurement.scheduled = true;
        requestAnimationFrame(() => requestAnimationFrame(() => {
          if (pending !== measurement) return;
          if (!measurement.isComplete()) {
            measurement.scheduled = false;
            return;
          }
          const elapsed = performance.now() - measurement.started;
          clearTimeout(measurement.timeout);
          measurement.item.textContent = `${measurement.label}：${(elapsed / 1000).toFixed(3)}秒（${elapsed <= 3000 ? "3秒以内" : "3秒超過"}）`;
          pending = undefined;
        }));
      }).observe(root, { childList: true, subtree: true, attributes: true, characterData: true });

      createRoot(root).render(React.createElement(StrictMode, null, React.createElement(App)));
    </script>
  </body>
</html>
